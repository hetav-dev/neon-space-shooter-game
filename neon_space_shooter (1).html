<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Space Shooter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --primary: #00f3ff;
            --secondary: #ff00ff;
            --danger: #ff3333;
            --success: #33ff33;
            --bg-color: #050510;
            --ui-bg: rgba(5, 5, 16, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Orbitron', sans-serif;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
            pointer-events: none;
            color: #fff;
            text-shadow: 0 0 5px var(--primary);
        }

        .hud-left, .hud-right {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hud-right {
            align-items: flex-end;
        }

        .stat {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        #health-bar-container {
            width: 180px;
            height: 18px;
            background: rgba(255,255,255,0.1);
            border: 2px solid #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 12px var(--danger);
        }

        #health-bar {
            width: 100%;
            height: 100%;
            background: var(--success);
            transition: width 0.2s ease, background-color 0.3s ease;
            box-shadow: 0 0 10px var(--success);
        }

        /* Animated Level Up Banner */
        #level-up-banner {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: 3rem;
            font-weight: 900;
            color: #ffff00;
            text-shadow: 0 0 20px #ffff00, 0 0 40px #ff8800;
            pointer-events: none;
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
            z-index: 15;
            letter-spacing: 4px;
        }

        #level-up-banner.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.1);
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--ui-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 4rem;
            color: var(--primary);
            text-shadow: 0 0 20px var(--primary), 0 0 40px var(--primary);
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
        }

        .game-over-title {
            color: var(--danger);
            text-shadow: 0 0 20px var(--danger), 0 0 40px var(--danger);
        }

        p.subtitle {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 40px;
            text-shadow: 0 0 5px #fff;
            text-align: center;
        }

        .final-stats {
            margin-bottom: 30px;
            text-align: center;
            font-size: 1.5rem;
            color: #fff;
            line-height: 1.6;
            text-shadow: 0 0 10px var(--secondary);
        }

        button {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.1);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 30px var(--primary);
            transform: scale(1.05);
        }

        #pause-btn {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            padding: 5px 15px;
            font-size: 1rem;
            z-index: 10;
            pointer-events: auto;
        }

        #mobile-controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: none;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
            pointer-events: none;
        }

        .control-group {
            display: flex;
            gap: 15px;
        }

        .m-btn {
            width: 60px;
            height: 60px;
            background: rgba(0, 243, 255, 0.1);
            border: 2px solid var(--primary);
            border-radius: 50%;
            color: var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            pointer-events: auto;
            box-shadow: 0 0 10px var(--primary);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .m-btn:active {
            background: rgba(0, 243, 255, 0.4);
            transform: scale(0.9);
        }

        #btn-shoot {
            width: 70px;
            height: 70px;
            border-color: var(--secondary);
            color: var(--secondary);
            box-shadow: 0 0 10px var(--secondary);
            background: rgba(255, 0, 255, 0.1);
        }
        #btn-shoot:active {
            background: rgba(255, 0, 255, 0.4);
        }

        @media (max-width: 768px) {
            #mobile-controls { display: flex; }
            h1 { font-size: 2.5rem; }
            .stat { font-size: 1rem; }
            #health-bar-container { width: 100px; height: 12px; }
            .subtitle { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- HUD -->
        <div id="hud">
            <div class="hud-left">
                <div class="stat">SCORE: <span id="score-display">0</span></div>
                <div class="stat">LEVEL: <span id="level-display">1</span></div>
                <div class="stat" id="powerup-display" style="color: var(--success); font-size: 0.95rem; min-height: 1.4rem; text-shadow: 0 0 8px var(--success);"></div>
            </div>
            <div class="hud-right">
                <div class="stat">HI-SCORE: <span id="hi-score-display">0</span></div>
                <div id="health-bar-container">
                    <div id="health-bar"></div>
                </div>
            </div>
        </div>

        <div id="level-up-banner">LEVEL UP!</div>

        <button id="pause-btn">PAUSE (P)</button>

        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h1>Neon Strike</h1>
            <p class="subtitle">A/D or Arrows to Move | Space to Shoot</p>
            <button id="start-btn">Initialize</button>
        </div>

        <!-- Pause Screen -->
        <div id="pause-screen" class="screen hidden">
            <h1>PAUSED</h1>
            <button id="resume-btn">Resume</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen hidden">
            <h1 class="game-over-title">SYSTEM FAILURE</h1>
            <div class="final-stats">
                Score: <span id="final-score">0</span><br>
                Level Reached: <span id="final-level">1</span>
            </div>
            <button id="restart-btn">Reboot System</button>
        </div>

        <!-- Mobile Controls -->
        <div id="mobile-controls">
            <div class="control-group">
                <div class="m-btn" id="btn-left">◀</div>
                <div class="m-btn" id="btn-right">▶</div>
            </div>
            <div class="m-btn" id="btn-shoot">⚡</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const screens = {
            start: document.getElementById('start-screen'),
            pause: document.getElementById('pause-screen'),
            gameOver: document.getElementById('game-over-screen')
        };
        const displays = {
            score: document.getElementById('score-display'),
            highScore: document.getElementById('hi-score-display'),
            level: document.getElementById('level-display'),
            healthBar: document.getElementById('health-bar'),
            finalScore: document.getElementById('final-score'),
            finalLevel: document.getElementById('final-level'),
            powerup: document.getElementById('powerup-display'),
            levelUpBanner: document.getElementById('level-up-banner')
        };

        // Game State
        let gameState = 'START'; // START, PLAYING, PAUSED, GAMEOVER
        let animationId;
        let lastTime = 0;

        // Game Stats
        const MAX_HEALTH = 200; // Increased Player HP
        let score = 0;
        let highScore = localStorage.getItem('neonShooterHighScore') || 0;
        let level = 1;
        let health = MAX_HEALTH;

        displays.highScore.innerText = highScore;

        // Inputs & Touch Tracking
        const keys = {
            ArrowLeft: false, ArrowRight: false,
            a: false, d: false,
            ' ': false
        };
        let isTouchDragging = false;
        let touchTargetX = null;

        // Entities arrays
        let stars = [];
        let bullets = [];
        let enemies = [];
        let particles = [];
        let powerups = [];
        let floatingTexts = [];

        // Timers
        let enemySpawnTimer = 0;
        let enemySpawnInterval = 1300;
        let powerupSpawnTimer = 0;

        // Audio
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'shoot') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(900, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
                gainNode.gain.setValueAtTime(0.12, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'explosion') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.35);
                gainNode.gain.setValueAtTime(0.25, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'powerup') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.linearRampToValueAtTime(880, now + 0.12);
                osc.frequency.linearRampToValueAtTime(1320, now + 0.25);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.12);
                gainNode.gain.setValueAtTime(0.35, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            }
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (player) {
                player.y = canvas.height - 80;
            }
        }
        window.addEventListener('resize', resize);

        // Player Class with Sleek Design & Tilt Animation
        class Player {
            constructor() {
                this.width = 46;
                this.height = 46;
                this.x = canvas.width / 2;
                this.y = canvas.height - 80;
                this.speed = 550; // Increased speed for fluid controls
                this.color = '#00f3ff';
                this.lastShot = 0;
                this.shootCooldown = 110; // Lowered cooldown (faster fire)
                this.tiltAngle = 0;
                
                // Active Powerup Timers
                this.shieldTime = 0;
                this.rapidFireTime = 0;
                this.doubleScoreTime = 0;
                this.scatterTime = 0;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.tiltAngle);
                
                // Shield Dome Effect
                if (this.shieldTime > 0) {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.width * 1.1, 0, Math.PI * 2);
                    ctx.strokeStyle = '#33ff33';
                    ctx.lineWidth = 3;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#33ff33';
                    ctx.fillStyle = 'rgba(51, 255, 51, 0.12)';
                    ctx.fill();
                    ctx.stroke();
                }

                // Sleek Neon Fighter Ship Design
                ctx.shadowBlur = 18;
                ctx.shadowColor = this.color;

                // Main Wing Hull
                ctx.fillStyle = '#0a192f';
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, -this.height / 2 - 6); // Nose tip
                ctx.lineTo(this.width / 2 + 5, this.height / 2); // Right wing tip
                ctx.lineTo(this.width / 4, this.height / 3); // Right inner notch
                ctx.lineTo(0, this.height / 2 + 2); // Tail core
                ctx.lineTo(-this.width / 4, this.height / 3); // Left inner notch
                ctx.lineTo(-this.width / 2 - 5, this.height / 2); // Left wing tip
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Side Plasma Wing Cannons
                ctx.fillStyle = '#ff00ff';
                ctx.fillRect(-this.width / 2 - 6, -2, 4, 14);
                ctx.fillRect(this.width / 2 + 2, -2, 4, 14);

                // Cockpit Core Glow
                ctx.fillStyle = '#00f3ff';
                ctx.beginPath();
                ctx.ellipse(0, -5, 6, 12, 0, 0, Math.PI * 2);
                ctx.fill();

                // Dynamic Thruster Engine Plume
                const thrusterHeight = 12 + Math.random() * 12;
                const gradient = ctx.createLinearGradient(0, this.height/2, 0, this.height/2 + thrusterHeight);
                gradient.addColorStop(0, '#00f3ff');
                gradient.addColorStop(0.5, '#ff00ff');
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.moveTo(-8, this.height / 2 + 2);
                ctx.lineTo(8, this.height / 2 + 2);
                ctx.lineTo(0, this.height / 2 + 2 + thrusterHeight);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }

            update(dt) {
                let moveDir = 0;
                if (keys.ArrowLeft || keys.a) moveDir -= 1;
                if (keys.ArrowRight || keys.d) moveDir += 1;

                // Mobile Touch Direct Drag handling
                if (isTouchDragging && touchTargetX !== null) {
                    const diff = touchTargetX - this.x;
                    if (Math.abs(diff) > 5) {
                        moveDir = Math.sign(diff);
                        this.x += moveDir * Math.min(Math.abs(diff), this.speed * dt);
                    }
                } else {
                    this.x += moveDir * this.speed * dt;
                }

                // Smooth Steering Bank Tilt Animation
                const targetTilt = moveDir * 0.32;
                this.tiltAngle += (targetTilt - this.tiltAngle) * 12 * dt;

                // Screen Boundary Containment
                this.x = Math.max(this.width / 2 + 10, Math.min(canvas.width - this.width / 2 - 10, this.x));

                // Powerup Countdown Timers
                if (this.shieldTime > 0) this.shieldTime -= dt;
                if (this.rapidFireTime > 0) this.rapidFireTime -= dt;
                if (this.doubleScoreTime > 0) this.doubleScoreTime -= dt;
                if (this.scatterTime > 0) this.scatterTime -= dt;

                // Update Active HUD Powerup Text
                let activePowerups = [];
                if (this.shieldTime > 0) activePowerups.push(`🛡️ SHIELD (${Math.ceil(this.shieldTime)}s)`);
                if (this.rapidFireTime > 0) activePowerups.push(`⚡ RAPID (${Math.ceil(this.rapidFireTime)}s)`);
                if (this.scatterTime > 0) activePowerups.push(`💥 SPREAD (${Math.ceil(this.scatterTime)}s)`);
                if (this.doubleScoreTime > 0) activePowerups.push(`✨ 2X PTS (${Math.ceil(this.doubleScoreTime)}s)`);
                displays.powerup.innerText = activePowerups.join(' | ');

                // Auto/Manual Shooting Logic
                if (keys[' '] || isTouchDragging) {
                    const cd = this.rapidFireTime > 0 ? 60 : this.shootCooldown;
                    if (performance.now() - this.lastShot > cd) {
                        this.shoot();
                        this.lastShot = performance.now();
                    }
                }
            }

            shoot() {
                playSound('shoot');
                if (this.scatterTime > 0) {
                    // 5-Bullet Scatter Cannon Fan Spread
                    [-180, -90, 0, 90, 180].forEach(vx => {
                        bullets.push(new Bullet(this.x, this.y - this.height / 2, vx, -850));
                    });
                } else if (this.rapidFireTime > 0) {
                    // Twin Rapid Laser Stream
                    bullets.push(new Bullet(this.x - 12, this.y - this.height / 2, 0, -950, '#00f3ff'));
                    bullets.push(new Bullet(this.x + 12, this.y - this.height / 2, 0, -950, '#00f3ff'));
                } else {
                    // Standard Plasma Bullet
                    bullets.push(new Bullet(this.x, this.y - this.height / 2, 0, -850, '#ff00ff'));
                }
            }
        }

        class Bullet {
            constructor(x, y, vx = 0, vy = -850, color = '#ff00ff') {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.width = 5;
                this.height = 18;
                this.color = color;
                this.damage = 1;
            }

            draw() {
                ctx.save();
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.fillRect(this.x - this.width / 2, this.y, this.width, this.height);
                ctx.restore();
            }

            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
            }
        }

        // Expanded Enemy Types: Scout, Basic, Fast, Tank, Dreadnought Titan
        class Enemy {
            constructor(x) {
                this.x = x;
                this.y = -60;
                
                const rand = Math.random();
                if (rand > 0.88 && level >= 3) {
                    // Dreadnought Titan (Slow Behemoth, Huge HP)
                    this.type = 'titan';
                    this.width = 75;
                    this.height = 70;
                    this.hp = 18 + Math.floor(level * 2);
                    this.maxHp = this.hp;
                    this.speed = 45 + (level * 3);
                    this.color = '#a855f7'; // Purple Neon
                    this.scoreVal = 250;
                } else if (rand > 0.65 && level >= 2) {
                    // Armored Tank
                    this.type = 'tank';
                    this.width = 50;
                    this.height = 50;
                    this.hp = 6 + Math.floor(level * 1.2);
                    this.maxHp = this.hp;
                    this.speed = 85 + (level * 6);
                    this.color = '#ff3366';
                    this.scoreVal = 80;
                } else if (rand > 0.45) {
                    // Fast Interceptor
                    this.type = 'fast';
                    this.width = 28;
                    this.height = 36;
                    this.hp = 2 + Math.floor(level / 3);
                    this.maxHp = this.hp;
                    this.speed = 220 + (level * 15);
                    this.color = '#ffff00';
                    this.scoreVal = 40;
                } else if (rand < 0.25) {
                    // Small Scout Dagger (1 HP, Very Fast Nimble Ship)
                    this.type = 'scout';
                    this.width = 22;
                    this.height = 22;
                    this.hp = 1; // Dies in 1 single hit!
                    this.maxHp = 1;
                    this.speed = 320 + (level * 20);
                    this.color = '#00ffff';
                    this.scoreVal = 20;
                } else {
                    // Basic Corvette
                    this.type = 'basic';
                    this.width = 36;
                    this.height = 36;
                    this.hp = 3 + Math.floor(level / 2);
                    this.maxHp = this.hp;
                    this.speed = 130 + (level * 10);
                    this.color = '#ffaa00';
                    this.scoreVal = 30;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2.5;
                ctx.fillStyle = 'rgba(10, 10, 25, 0.85)';

                if (this.type === 'titan') {
                    // Hexagonal Armored Titan Design
                    ctx.beginPath();
                    ctx.moveTo(0, this.height / 2);
                    ctx.lineTo(this.width / 2, this.height / 4);
                    ctx.lineTo(this.width / 2, -this.height / 2);
                    ctx.lineTo(-this.width / 2, -this.height / 2);
                    ctx.lineTo(-this.width / 2, this.height / 4);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    // Inner glowing armor core
                    ctx.fillStyle = '#a855f7';
                    ctx.fillRect(-15, -15, 30, 30);
                } else if (this.type === 'scout') {
                    // Sleek Arrowhead Scout
                    ctx.beginPath();
                    ctx.moveTo(0, this.height / 2);
                    ctx.lineTo(this.width / 2, -this.height / 2);
                    ctx.lineTo(0, -this.height / 4);
                    ctx.lineTo(-this.width / 2, -this.height / 2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } else if (this.type === 'fast') {
                    ctx.beginPath();
                    ctx.moveTo(0, this.height / 2);
                    ctx.lineTo(this.width / 2, -this.height / 2);
                    ctx.lineTo(-this.width / 2, -this.height / 2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } else if (this.type === 'tank') {
                    ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
                    ctx.strokeRect(-this.width / 2, -this.height / 2, this.width, this.height);
                } else {
                    ctx.beginPath();
                    ctx.moveTo(0, this.height / 2);
                    ctx.lineTo(this.width / 2, 0);
                    ctx.lineTo(0, -this.height / 2);
                    ctx.lineTo(-this.width / 2, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }

                // Health Bar visual overlay for damaged enemies
                if (this.hp < this.maxHp) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.fillRect(-this.width / 2, -this.height / 2 - 12, this.width, 5);
                    ctx.fillStyle = '#33ff33';
                    ctx.fillRect(-this.width / 2, -this.height / 2 - 12, this.width * (this.hp / this.maxHp), 5);
                }

                ctx.restore();
            }

            update(dt) {
                this.y += this.speed * dt;
            }
        }

        // Distinct PowerUps & Dynamic Icon Renderers
        class PowerUp {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.speed = 110;
                this.width = 32;
                this.height = 32;

                const types = [
                    { t: 'shield', c: '#33ff33' },
                    { t: 'rapid', c: '#00f3ff' },
                    { t: 'double', c: '#ff00ff' },
                    { t: 'scatter', c: '#ff8800' },
                    { t: 'repair', c: '#10b981' }
                ];
                const selected = types[Math.floor(Math.random() * types.length)];
                this.type = selected.t;
                this.color = selected.c;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.shadowBlur = 18;
                ctx.shadowColor = this.color;
                
                const pulse = 1 + Math.sin(performance.now() / 140) * 0.12;
                ctx.scale(pulse, pulse);

                // Orb Ring Background
                ctx.beginPath();
                ctx.arc(0, 0, this.width / 2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(10, 15, 30, 0.85)';
                ctx.fill();
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2.5;
                ctx.stroke();

                // Draw Innovative Custom Icons inside Powerup Orbs
                ctx.fillStyle = this.color;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;

                if (this.type === 'shield') {
                    // Shield Dome Icon
                    ctx.beginPath();
                    ctx.arc(0, 1, 7, Math.PI, 0, false);
                    ctx.lineTo(0, 8);
                    ctx.closePath();
                    ctx.fill();
                } else if (this.type === 'rapid') {
                    // Dual Lightning Bolt Icon
                    ctx.beginPath();
                    ctx.moveTo(2, -8); ctx.lineTo(-4, 0); ctx.lineTo(1, 0); ctx.lineTo(-2, 8); ctx.lineTo(4, 0); ctx.lineTo(-1, 0);
                    ctx.closePath();
                    ctx.fill();
                } else if (this.type === 'double') {
                    // 2X Multiplier Badge Icon
                    ctx.font = 'bold 12px Orbitron';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('2X', 0, 1);
                } else if (this.type === 'scatter') {
                    // 3-Beam Spread Shot Icon
                    ctx.beginPath();
                    ctx.moveTo(0, 6); ctx.lineTo(-7, -6);
                    ctx.moveTo(0, 6); ctx.lineTo(0, -8);
                    ctx.moveTo(0, 6); ctx.lineTo(7, -6);
                    ctx.stroke();
                } else if (this.type === 'repair') {
                    // Nanite Cross Heal Icon
                    ctx.fillRect(-3, -7, 6, 14);
                    ctx.fillRect(-7, -3, 14, 6);
                }

                ctx.restore();
            }

            update(dt) {
                this.y += this.speed * dt;
            }
        }

        // Floating Score & Notification Text Effects
        class FloatingText {
            constructor(x, y, text, color = '#ffffff') {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.alpha = 1.0;
                this.vy = -60;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.font = 'bold 16px Orbitron';
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }

            update(dt) {
                this.y += this.vy * dt;
                this.alpha -= 1.2 * dt;
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 450;
                this.vy = (Math.random() - 0.5) * 450;
                this.life = 1.0;
                this.decay = 0.8 + Math.random() * 2;
                this.color = color;
                this.size = Math.random() * 3.5 + 1;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= this.decay * dt;
            }
        }

        class Star {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height;
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = 0;
                this.size = Math.random() * 2.2;
                this.speed = (Math.random() * 60) + 25;
                this.brightness = Math.random();
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.brightness})`;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
            update(dt) {
                this.y += this.speed * dt * (1 + level * 0.08);
                if (this.y > canvas.height) this.reset();
            }
        }

        let player;

        function init() {
            initAudio();
            resize();
            
            score = 0;
            level = 1;
            health = MAX_HEALTH;
            enemySpawnInterval = 1300;
            
            updateHUD();
            
            player = new Player();
            bullets = [];
            enemies = [];
            particles = [];
            powerups = [];
            floatingTexts = [];
            
            stars = [];
            for (let i = 0; i < 110; i++) stars.push(new Star());

            gameState = 'PLAYING';
            screens.start.classList.add('hidden');
            screens.pause.classList.add('hidden');
            screens.gameOver.classList.add('hidden');

            lastTime = performance.now();
            if (animationId) cancelAnimationFrame(animationId);
            gameLoop(lastTime);
        }

        function triggerLevelUp() {
            displays.levelUpBanner.classList.add('show');
            setTimeout(() => {
                displays.levelUpBanner.classList.remove('show');
            }, 1200);
        }

        function createExplosion(x, y, color, count = 20) {
            playSound('explosion');
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function checkCollision(r1, r2) {
            const dx = r1.x - r2.x;
            const dy = r1.y - r2.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            return dist < (r1.width / 2 + r2.width / 2) * 0.82;
        }

        function updateHUD() {
            displays.score.innerText = score;
            displays.level.innerText = level;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neonShooterHighScore', highScore);
                displays.highScore.innerText = highScore;
            }
            
            const hpPercent = Math.max(0, (health / MAX_HEALTH) * 100);
            displays.healthBar.style.width = `${hpPercent}%`;
            
            if (hpPercent > 55) displays.healthBar.style.background = 'var(--success)';
            else if (hpPercent > 25) displays.healthBar.style.background = '#eab308';
            else displays.healthBar.style.background = 'var(--danger)';
        }

        function takeDamage(amt) {
            if (player.shieldTime > 0) return; // Shield Negates Damage!
            
            health -= amt;
            playSound('hit');
            updateHUD();

            // Screen Shake Shockwave Effect
            document.getElementById('game-container').animate([
                { transform: 'translate(6px, 6px)' },
                { transform: 'translate(-6px, -6px)' },
                { transform: 'translate(4px, -4px)' },
                { transform: 'translate(0, 0)' }
            ], { duration: 180 });

            if (health <= 0) {
                health = 0;
                gameOver();
            }
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            createExplosion(player.x, player.y, player.color, 60);
            setTimeout(() => {
                screens.gameOver.classList.remove('hidden');
                displays.finalScore.innerText = score;
                displays.finalLevel.innerText = level;
            }, 500);
        }

        function gameLoop(timestamp) {
            if (gameState !== 'PLAYING') return;

            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;

            ctx.fillStyle = 'rgba(5, 5, 16, 0.35)'; // High-speed trail glow
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Stars Background
            stars.forEach(s => { s.update(dt); s.draw(); });

            // Spawn Enemy Wave
            enemySpawnTimer += dt * 1000;
            if (enemySpawnTimer > enemySpawnInterval) {
                const x = 40 + Math.random() * (canvas.width - 80);
                enemies.push(new Enemy(x));
                enemySpawnTimer = 0;
            }

            // Spawn Random Powerups
            powerupSpawnTimer += dt * 1000;
            if (powerupSpawnTimer > 9000) {
                if (Math.random() > 0.4) {
                    const x = 40 + Math.random() * (canvas.width - 80);
                    powerups.push(new PowerUp(x, -30));
                }
                powerupSpawnTimer = 0;
            }

            // Update Player
            if (health > 0) {
                player.update(dt);
                player.draw();
            }

            // Update Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.update(dt);
                b.draw();
                if (b.y < -50 || b.x < -20 || b.x > canvas.width + 20) {
                    bullets.splice(i, 1);
                }
            }

            // Update Powerups & Collisions
            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.update(dt);
                p.draw();
                
                if (health > 0 && checkCollision(p, player)) {
                    playSound('powerup');
                    if (p.type === 'shield') player.shieldTime = 10;
                    if (p.type === 'rapid') player.rapidFireTime = 8;
                    if (p.type === 'double') player.doubleScoreTime = 12;
                    if (p.type === 'scatter') player.scatterTime = 8;
                    if (p.type === 'repair') {
                        health = Math.min(MAX_HEALTH, health + 60);
                        floatingTexts.push(new FloatingText(player.x, player.y - 30, '+60 HP', '#10b981'));
                        updateHUD();
                    }
                    powerups.splice(i, 1);
                } else if (p.y > canvas.height + 50) {
                    powerups.splice(i, 1);
                }
            }

            // Update Enemies & Collisions
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.update(dt);
                e.draw();

                // Enemy Reached Bottom
                if (e.y > canvas.height + e.height) {
                    takeDamage(12);
                    enemies.splice(i, 1);
                    continue;
                }

                // Enemy Hit Player
                if (health > 0 && checkCollision(e, player)) {
                    takeDamage(22);
                    createExplosion(e.x, e.y, e.color, 25);
                    enemies.splice(i, 1);
                    continue;
                }

                // Bullet Hit Enemy
                let hit = false;
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    if (checkCollision(e, b)) {
                        e.hp -= b.damage;
                        createExplosion(b.x, b.y, b.color, 4);
                        bullets.splice(j, 1);
                        
                        if (e.hp <= 0) {
                            createExplosion(e.x, e.y, e.color, e.type === 'titan' ? 45 : 18);
                            const pts = e.scoreVal * (player.doubleScoreTime > 0 ? 2 : 1);
                            score += pts;
                            floatingTexts.push(new FloatingText(e.x, e.y, `+${pts}`, e.color));
                            hit = true;
                            break;
                        }
                    }
                }
                
                if (hit) {
                    enemies.splice(i, 1);
                    // Level Progression Check
                    if (score >= level * 450) {
                        level++;
                        enemySpawnInterval = Math.max(350, enemySpawnInterval - 90);
                        triggerLevelUp();
                        updateHUD();
                    }
                    updateHUD();
                }
            }

            // Floating Text Animations
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.update(dt);
                ft.draw();
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            }

            // Explosive Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update(dt);
                p.draw();
                if (p.life <= 0) particles.splice(i, 1);
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        // Keyboard Event Bindings
        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
            if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
        });

        // Mobile Canvas Touch Drag & Auto-Fire Support
        canvas.addEventListener('touchstart', (e) => {
            if (gameState !== 'PLAYING') return;
            isTouchDragging = true;
            touchTargetX = e.touches[0].clientX;
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (!isTouchDragging || gameState !== 'PLAYING') return;
            touchTargetX = e.touches[0].clientX;
        }, { passive: true });

        canvas.addEventListener('touchend', () => {
            isTouchDragging = false;
            touchTargetX = null;
        });

        // UI Buttons
        document.getElementById('start-btn').addEventListener('click', init);
        document.getElementById('restart-btn').addEventListener('click', init);
        document.getElementById('pause-btn').addEventListener('click', togglePause);
        document.getElementById('resume-btn').addEventListener('click', togglePause);

        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                screens.pause.classList.remove('hidden');
                if (audioCtx) audioCtx.suspend();
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                screens.pause.classList.add('hidden');
                lastTime = performance.now();
                if (audioCtx) audioCtx.resume();
                requestAnimationFrame(gameLoop);
            }
        }

        // Mobile On-Screen Controls Binding
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnShoot = document.getElementById('btn-shoot');

        function bindTouch(element, keyMapping) {
            element.addEventListener('touchstart', (e) => {
                e.preventDefault();
                keys[keyMapping] = true;
            });
            element.addEventListener('touchend', (e) => {
                e.preventDefault();
                keys[keyMapping] = false;
            });
            element.addEventListener('mousedown', (e) => {
                e.preventDefault();
                keys[keyMapping] = true;
            });
            element.addEventListener('mouseup', (e) => {
                e.preventDefault();
                keys[keyMapping] = false;
            });
            element.addEventListener('mouseleave', () => {
                keys[keyMapping] = false;
            });
        }

        bindTouch(btnLeft, 'ArrowLeft');
        bindTouch(btnRight, 'ArrowRight');
        bindTouch(btnShoot, ' ');

        // Initial setup
        resize();
        updateHUD();
        for (let i = 0; i < 100; i++) stars.push(new Star());
        stars.forEach(s => { s.y = Math.random() * canvas.height; s.draw(); });

    </script>
</body>
</html>
