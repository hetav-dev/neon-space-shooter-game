<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Space Shooter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --primary: #00f3ff;
            --secondary: #ff00ff;
            --danger: #ff3333;
            --success: #33ff33;
            --bg-color: #050510;
            --ui-bg: rgba(5, 5, 16, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Orbitron', sans-serif;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
            pointer-events: none;
            color: #fff;
            text-shadow: 0 0 5px var(--primary);
        }

        .hud-left, .hud-right {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hud-right {
            align-items: flex-end;
        }

        .stat {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        #health-bar-container {
            width: 150px;
            height: 15px;
            background: rgba(255,255,255,0.1);
            border: 2px solid #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px var(--danger);
        }

        #health-bar {
            width: 100%;
            height: 100%;
            background: var(--danger);
            transition: width 0.2s ease;
            box-shadow: 0 0 10px var(--danger);
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--ui-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 4rem;
            color: var(--primary);
            text-shadow: 0 0 20px var(--primary), 0 0 40px var(--primary);
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
        }

        .game-over-title {
            color: var(--danger);
            text-shadow: 0 0 20px var(--danger), 0 0 40px var(--danger);
        }

        p.subtitle {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 40px;
            text-shadow: 0 0 5px #fff;
            text-align: center;
        }

        .final-stats {
            margin-bottom: 30px;
            text-align: center;
            font-size: 1.5rem;
            color: #fff;
            line-height: 1.6;
            text-shadow: 0 0 10px var(--secondary);
        }

        button {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.1);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 30px var(--primary);
            transform: scale(1.05);
        }

        #pause-btn {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            padding: 5px 15px;
            font-size: 1rem;
            z-index: 10;
            pointer-events: auto;
        }

        #mobile-controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: none;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
            pointer-events: none;
        }

        .control-group {
            display: flex;
            gap: 15px;
        }

        .m-btn {
            width: 60px;
            height: 60px;
            background: rgba(0, 243, 255, 0.1);
            border: 2px solid var(--primary);
            border-radius: 50%;
            color: var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            pointer-events: auto;
            box-shadow: 0 0 10px var(--primary);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .m-btn:active {
            background: rgba(0, 243, 255, 0.4);
            transform: scale(0.9);
        }

        #btn-shoot {
            width: 70px;
            height: 70px;
            border-color: var(--secondary);
            color: var(--secondary);
            box-shadow: 0 0 10px var(--secondary);
            background: rgba(255, 0, 255, 0.1);
        }
        #btn-shoot:active {
            background: rgba(255, 0, 255, 0.4);
        }

        @media (max-width: 768px) {
            #mobile-controls { display: flex; }
            h1 { font-size: 2.5rem; }
            .stat { font-size: 1rem; }
            #health-bar-container { width: 100px; height: 12px; }
            .subtitle { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- HUD -->
        <div id="hud">
            <div class="hud-left">
                <div class="stat">SCORE: <span id="score-display">0</span></div>
                <div class="stat">LEVEL: <span id="level-display">1</span></div>
                <div class="stat" id="powerup-display" style="color: var(--success); font-size: 0.9rem; min-height: 1.2rem;"></div>
            </div>
            <div class="hud-right">
                <div class="stat">HI-SCORE: <span id="hi-score-display">0</span></div>
                <div id="health-bar-container">
                    <div id="health-bar"></div>
                </div>
            </div>
        </div>

        <button id="pause-btn">PAUSE (P)</button>

        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h1>Neon Strike</h1>
            <p class="subtitle">A/D or Arrows to Move | Space to Shoot</p>
            <button id="start-btn">Initialize</button>
        </div>

        <!-- Pause Screen -->
        <div id="pause-screen" class="screen hidden">
            <h1>PAUSED</h1>
            <button id="resume-btn">Resume</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen hidden">
            <h1 class="game-over-title">SYSTEM FAILURE</h1>
            <div class="final-stats">
                Score: <span id="final-score">0</span><br>
                Level Reached: <span id="final-level">1</span>
            </div>
            <button id="restart-btn">Reboot System</button>
        </div>

        <!-- Mobile Controls -->
        <div id="mobile-controls">
            <div class="control-group">
                <div class="m-btn" id="btn-left">◀</div>
                <div class="m-btn" id="btn-right">▶</div>
            </div>
            <div class="m-btn" id="btn-shoot">●</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const screens = {
            start: document.getElementById('start-screen'),
            pause: document.getElementById('pause-screen'),
            gameOver: document.getElementById('game-over-screen')
        };
        const displays = {
            score: document.getElementById('score-display'),
            highScore: document.getElementById('hi-score-display'),
            level: document.getElementById('level-display'),
            healthBar: document.getElementById('health-bar'),
            finalScore: document.getElementById('final-score'),
            finalLevel: document.getElementById('final-level'),
            powerup: document.getElementById('powerup-display')
        };

        // Game State
        let gameState = 'START'; // START, PLAYING, PAUSED, GAMEOVER
        let animationId;
        let lastTime = 0;

        // Game Stats
        const MAX_HEALTH = 100;
        let score = 0;
        let highScore = localStorage.getItem('neonShooterHighScore') || 0;
        let level = 1;
        let health = MAX_HEALTH;

        displays.highScore.innerText = highScore;

        // Inputs
        const keys = {
            ArrowLeft: false, ArrowRight: false,
            a: false, d: false,
            ' ': false
        };

        // Arrays for entities
        let stars = [];
        let bullets = [];
        let enemies = [];
        let particles = [];
        let powerups = [];

        // Difficulty / Timers
        let enemySpawnTimer = 0;
        let enemySpawnInterval = 1500; // ms
        let powerupSpawnTimer = 0;
        
        // Web Audio API
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if(audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'shoot') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'explosion') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'powerup') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.1);
                osc.frequency.linearRampToValueAtTime(1200, now + 0.2);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            }
        }

        // Resize Handler
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (player) {
                player.y = canvas.height - 80;
            }
        }
        window.addEventListener('resize', resize);

        // Player Class
        class Player {
            constructor() {
                this.width = 40;
                this.height = 40;
                this.x = canvas.width / 2;
                this.y = canvas.height - 80;
                this.speed = 400; // pixels per second
                this.color = '#00f3ff';
                this.lastShot = 0;
                this.shootCooldown = 250; // ms
                
                // Powerups
                this.shieldTime = 0;
                this.rapidFireTime = 0;
                this.doubleScoreTime = 0;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Shield effect
                if (this.shieldTime > 0) {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.width, 0, Math.PI * 2);
                    ctx.strokeStyle = '#33ff33';
                    ctx.lineWidth = 3;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#33ff33';
                    ctx.stroke();
                }

                // Ship glow
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;

                // Draw Ship (Triangle)
                ctx.beginPath();
                ctx.moveTo(0, -this.height / 2);
                ctx.lineTo(this.width / 2, this.height / 2);
                ctx.lineTo(0, this.height / 4);
                ctx.lineTo(-this.width / 2, this.height / 2);
                ctx.closePath();
                ctx.fill();

                // Thruster
                ctx.fillStyle = '#ffaa00';
                ctx.shadowColor = '#ffaa00';
                ctx.beginPath();
                ctx.moveTo(-this.width / 4, this.height / 2 + 2);
                ctx.lineTo(this.width / 4, this.height / 2 + 2);
                ctx.lineTo(0, this.height / 2 + 15 + Math.random() * 10);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }

            update(dt) {
                // Movement
                if (keys.ArrowLeft || keys.a) this.x -= this.speed * dt;
                if (keys.ArrowRight || keys.d) this.x += this.speed * dt;

                // Bounds checking
                this.x = Math.max(this.width / 2, Math.min(canvas.width - this.width / 2, this.x));

                // Powerup Timers
                if (this.shieldTime > 0) this.shieldTime -= dt;
                if (this.rapidFireTime > 0) this.rapidFireTime -= dt;
                if (this.doubleScoreTime > 0) this.doubleScoreTime -= dt;

                // UI Powerup display
                let activePowerups = [];
                if (this.shieldTime > 0) activePowerups.push(`SHIELD: ${Math.ceil(this.shieldTime)}s`);
                if (this.rapidFireTime > 0) activePowerups.push(`RAPID: ${Math.ceil(this.rapidFireTime)}s`);
                if (this.doubleScoreTime > 0) activePowerups.push(`2X PTS: ${Math.ceil(this.doubleScoreTime)}s`);
                displays.powerup.innerText = activePowerups.join(' | ');

                // Shooting
                if (keys[' ']) {
                    const cooldown = this.rapidFireTime > 0 ? 100 : this.shootCooldown;
                    if (performance.now() - this.lastShot > cooldown) {
                        this.shoot();
                        this.lastShot = performance.now();
                    }
                }
            }

            shoot() {
                playSound('shoot');
                if (this.rapidFireTime > 0) {
                    // Spread shot
                    bullets.push(new Bullet(this.x - 15, this.y - this.height/2, -100));
                    bullets.push(new Bullet(this.x, this.y - this.height/2, 0));
                    bullets.push(new Bullet(this.x + 15, this.y - this.height/2, 100));
                } else {
                    bullets.push(new Bullet(this.x, this.y - this.height/2, 0));
                }
            }
        }

        class Bullet {
            constructor(x, y, vx) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = -600; // pixels per second
                this.width = 4;
                this.height = 15;
                this.color = '#ff00ff';
                this.damage = 1;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillRect(this.x - this.width/2, this.y, this.width, this.height);
                ctx.shadowBlur = 0; // reset
            }

            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
            }
        }

        class Enemy {
            constructor(x) {
                this.x = x;
                this.y = -50;
                
                // Determine type based on level
                const rand = Math.random();
                if (rand > 0.8 && level > 2) {
                    // Tank
                    this.type = 'tank';
                    this.width = 50;
                    this.height = 50;
                    this.hp = 5 + Math.floor(level / 2);
                    this.maxHp = this.hp;
                    this.speed = 80 + (level * 5);
                    this.color = '#ff3333';
                    this.scoreVal = 50;
                } else if (rand > 0.5 && level > 1) {
                    // Fast
                    this.type = 'fast';
                    this.width = 25;
                    this.height = 35;
                    this.hp = 1 + Math.floor(level / 4);
                    this.maxHp = this.hp;
                    this.speed = 200 + (level * 15);
                    this.color = '#ffff00';
                    this.scoreVal = 30;
                } else {
                    // Basic
                    this.type = 'basic';
                    this.width = 35;
                    this.height = 35;
                    this.hp = 2 + Math.floor(level / 3);
                    this.maxHp = this.hp;
                    this.speed = 120 + (level * 10);
                    this.color = '#ffaa00';
                    this.scoreVal = 10;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.fillStyle = 'rgba(0,0,0,0.8)';

                if (this.type === 'tank') {
                    ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                    ctx.strokeRect(-this.width/2, -this.height/2, this.width, this.height);
                } else if (this.type === 'fast') {
                    ctx.beginPath();
                    ctx.moveTo(0, this.height/2);
                    ctx.lineTo(this.width/2, -this.height/2);
                    ctx.lineTo(-this.width/2, -this.height/2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.moveTo(0, this.height/2);
                    ctx.lineTo(this.width/2, 0);
                    ctx.lineTo(0, -this.height/2);
                    ctx.lineTo(-this.width/2, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }

                // Health visual
                if (this.hp < this.maxHp) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.fillRect(-this.width/2, -this.height/2 - 10, this.width * (this.hp/this.maxHp), 4);
                }

                ctx.restore();
            }

            update(dt) {
                this.y += this.speed * dt;
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 400;
                this.vy = (Math.random() - 0.5) * 400;
                this.life = 1.0;
                this.decay = 0.5 + Math.random() * 2;
                this.color = color;
                this.size = Math.random() * 3 + 1;
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 5;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= this.decay * dt;
            }
        }

        class PowerUp {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.speed = 100;
                this.width = 25;
                this.height = 25;
                
                const types = [
                    { t: 'shield', c: '#33ff33', l: 'S' },
                    { t: 'rapid', c: '#00f3ff', l: 'R' },
                    { t: 'double', c: '#ff00ff', l: '2X' }
                ];
                const selected = types[Math.floor(Math.random() * types.length)];
                this.type = selected.t;
                this.color = selected.c;
                this.label = selected.l;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                
                // Pulsing effect
                const scale = 1 + Math.sin(performance.now() / 150) * 0.1;
                ctx.scale(scale, scale);

                ctx.beginPath();
                ctx.arc(0, 0, this.width/2, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.fillStyle = this.color;
                ctx.font = '12px Orbitron';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.label, 0, 0);

                ctx.restore();
            }

            update(dt) {
                this.y += this.speed * dt;
            }
        }

        class Star {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height; // initial random spread
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = 0;
                this.size = Math.random() * 2;
                this.speed = (Math.random() * 50) + 20;
                this.brightness = Math.random();
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.brightness})`;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
            update(dt) {
                this.y += this.speed * dt * (1 + level * 0.1); // Stars move faster as level increases
                if (this.y > canvas.height) this.reset();
            }
        }

        let player;

        function init() {
            initAudio();
            resize();
            
            // Reset Stats
            score = 0;
            level = 1;
            health = MAX_HEALTH;
            enemySpawnInterval = 1500;
            
            updateHUD();
            
            player = new Player();
            bullets = [];
            enemies = [];
            particles = [];
            powerups = [];
            
            // Init Stars
            stars = [];
            for(let i = 0; i < 100; i++) stars.push(new Star());

            gameState = 'PLAYING';
            screens.start.classList.add('hidden');
            screens.pause.classList.add('hidden');
            screens.gameOver.classList.add('hidden');

            lastTime = performance.now();
            if(animationId) cancelAnimationFrame(animationId);
            gameLoop(lastTime);
        }

        function createExplosion(x, y, color, count=15) {
            playSound('explosion');
            for(let i=0; i<count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function checkCollision(r1, r2) {
            // Simple AABB approximation based on centers
            const dx = r1.x - r2.x;
            const dy = r1.y - r2.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            return dist < (r1.width/2 + r2.width/2) * 0.8; // 0.8 for slightly forgiving hitboxes
        }

        function updateHUD() {
            displays.score.innerText = score;
            displays.level.innerText = level;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neonShooterHighScore', highScore);
                displays.highScore.innerText = highScore;
            }
            
            const hpPercent = Math.max(0, (health / MAX_HEALTH) * 100);
            displays.healthBar.style.width = `${hpPercent}%`;
            
            if(hpPercent > 50) displays.healthBar.style.background = 'var(--success)';
            else if(hpPercent > 25) displays.healthBar.style.background = 'yellow';
            else displays.healthBar.style.background = 'var(--danger)';
        }

        function takeDamage(amt) {
            if (player.shieldTime > 0) return; // Shield protects
            
            health -= amt;
            playSound('hit');
            updateHUD();

            // Screen shake effect
            document.getElementById('game-container').animate([
                { transform: 'translate(5px, 5px)' },
                { transform: 'translate(-5px, -5px)' },
                { transform: 'translate(5px, -5px)' },
                { transform: 'translate(-5px, 5px)' },
                { transform: 'translate(0, 0)' }
            ], { duration: 200 });

            if (health <= 0) {
                health = 0;
                gameOver();
            }
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            createExplosion(player.x, player.y, player.color, 50);
            setTimeout(() => {
                screens.gameOver.classList.remove('hidden');
                displays.finalScore.innerText = score;
                displays.finalLevel.innerText = level;
            }, 500);
        }

        function gameLoop(timestamp) {
            if (gameState !== 'PLAYING') return;

            const dt = (timestamp - lastTime) / 1000; // seconds
            lastTime = timestamp;

            // Clear canvas
            ctx.fillStyle = 'rgba(5, 5, 16, 0.4)'; // Trail effect
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update & Draw Stars
            stars.forEach(s => { s.update(dt); s.draw(); });

            // Spawn Enemies
            enemySpawnTimer += dt * 1000;
            if (enemySpawnTimer > enemySpawnInterval) {
                const x = 30 + Math.random() * (canvas.width - 60);
                enemies.push(new Enemy(x));
                enemySpawnTimer = 0;
            }

            // Spawn Powerups randomly
            powerupSpawnTimer += dt * 1000;
            if (powerupSpawnTimer > 10000) { // Every ~10 seconds chance
                if (Math.random() > 0.5) {
                    const x = 30 + Math.random() * (canvas.width - 60);
                    powerups.push(new PowerUp(x, -30));
                }
                powerupSpawnTimer = 0;
            }

            // Update & Draw Player
            if (health > 0) {
                player.update(dt);
                player.draw();
            }

            // Update & Draw Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.update(dt);
                b.draw();
                if (b.y < -50) {
                    bullets.splice(i, 1);
                }
            }

            // Update & Draw PowerUps
            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.update(dt);
                p.draw();
                
                // Collision with player
                if (health > 0 && checkCollision(p, player)) {
                    playSound('powerup');
                    if (p.type === 'shield') player.shieldTime = 10; // 10 seconds
                    if (p.type === 'rapid') player.rapidFireTime = 8;
                    if (p.type === 'double') player.doubleScoreTime = 12;
                    powerups.splice(i, 1);
                } else if (p.y > canvas.height + 50) {
                    powerups.splice(i, 1);
                }
            }

            // Update & Draw Enemies and Check Bullet Collisions
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.update(dt);
                e.draw();

                // Enemy reached bottom
                if (e.y > canvas.height + e.height) {
                    takeDamage(10);
                    enemies.splice(i, 1);
                    continue;
                }

                // Enemy hit player
                if (health > 0 && checkCollision(e, player)) {
                    takeDamage(20);
                    createExplosion(e.x, e.y, e.color);
                    enemies.splice(i, 1);
                    continue;
                }

                // Bullet hit enemy
                let hit = false;
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    if (checkCollision(e, b)) {
                        e.hp -= b.damage;
                        createExplosion(b.x, b.y, b.color, 3);
                        bullets.splice(j, 1);
                        
                        if (e.hp <= 0) {
                            createExplosion(e.x, e.y, e.color);
                            const pts = e.scoreVal * (player.doubleScoreTime > 0 ? 2 : 1);
                            score += pts;
                            hit = true;
                            break;
                        }
                    }
                }
                
                if (hit) {
                    enemies.splice(i, 1);
                    // Level progression
                    if (score > level * 500) {
                        level++;
                        enemySpawnInterval = Math.max(400, enemySpawnInterval - 100);
                        updateHUD();
                    }
                    updateHUD();
                }
            }

            // Update & Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update(dt);
                p.draw();
                if (p.life <= 0) particles.splice(i, 1);
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
            if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
        });

        // UI Buttons
        document.getElementById('start-btn').addEventListener('click', init);
        document.getElementById('restart-btn').addEventListener('click', init);
        document.getElementById('pause-btn').addEventListener('click', togglePause);
        document.getElementById('resume-btn').addEventListener('click', togglePause);

        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                screens.pause.classList.remove('hidden');
                if(audioCtx) audioCtx.suspend();
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                screens.pause.classList.add('hidden');
                lastTime = performance.now();
                if(audioCtx) audioCtx.resume();
                requestAnimationFrame(gameLoop);
            }
        }

        // Mobile Controls Binding
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnShoot = document.getElementById('btn-shoot');

        function bindTouch(element, keyMapping) {
            element.addEventListener('touchstart', (e) => {
                e.preventDefault();
                keys[keyMapping] = true;
            });
            element.addEventListener('touchend', (e) => {
                e.preventDefault();
                keys[keyMapping] = false;
            });
            element.addEventListener('mousedown', (e) => {
                e.preventDefault();
                keys[keyMapping] = true;
            });
            element.addEventListener('mouseup', (e) => {
                e.preventDefault();
                keys[keyMapping] = false;
            });
            element.addEventListener('mouseleave', (e) => {
                keys[keyMapping] = false;
            });
        }

        bindTouch(btnLeft, 'ArrowLeft');
        bindTouch(btnRight, 'ArrowRight');
        bindTouch(btnShoot, ' ');

        // Initial setup
        resize();
        updateHUD();
        // Draw background preview before start
        for(let i = 0; i < 100; i++) stars.push(new Star());
        stars.forEach(s => { s.y = Math.random() * canvas.height; s.draw(); });

    </script>
</body>
</html>
